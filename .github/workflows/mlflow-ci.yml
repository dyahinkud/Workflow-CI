name: MLflow CI Workflow

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  train-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install mlflow dagshub pandas scikit-learn docker

      - name: Run MLflow Project
        env:
          DAGSHUB_USER_TOKEN: ${{ secrets.DAGSHUB_TOKEN }}
          MLFLOW_TRACKING_URI: https://dagshub.com/dyahinkud/Membangun_Model.mlflow
          MLFLOW_TRACKING_USERNAME: dyahinkud
          MLFLOW_TRACKING_PASSWORD: ${{ secrets.DAGSHUB_TOKEN }}
        run: |
          # Run the MLflow project
          # Using --env-manager local since we already installed dependencies in the runner
          mlflow run MLProject/ --env-manager local
          
      - name: Extract Run ID
        id: vars
        run: |
          # The script saves run_id.txt in the CWD of the script, which is MLProject/
          RUN_ID=$(cat MLProject/run_id.txt)
          echo "RUN_ID=$RUN_ID" >> $GITHUB_OUTPUT
          echo "MODEL_URI=runs:/$RUN_ID/model" >> $GITHUB_OUTPUT

      - name: Upload Artifacts to GitHub
        uses: actions/upload-artifact@v4
        with:
          name: model-artifacts
          path: MLProject/best_model_local/

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Docker Image
        env:
          MLFLOW_TRACKING_URI: https://dagshub.com/dyahinkud/Membangun_Model.mlflow
          MLFLOW_TRACKING_USERNAME: dyahinkud
          MLFLOW_TRACKING_PASSWORD: ${{ secrets.DAGSHUB_TOKEN }}
        run: |
          # Build the docker image using MLflow
          # This command will pull the model from DagsHub MLflow if needed
          mlflow models build-docker -m ${{ steps.vars.outputs.MODEL_URI }} -n ${{ secrets.DOCKERHUB_USERNAME }}/sentiment-analysis-model:latest
          
          # Push the image to Docker Hub
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/sentiment-analysis-model:latest
